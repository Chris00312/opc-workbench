<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人 IP · OPC 智能工作台</title>
<style>
body{margin:0;background:#fff;color:#1A1F36;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei","Helvetica Neue",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#3651C9;text-decoration:none}a:hover{color:#1F2F8A}
h1,h2,h3{margin:0;font-weight:600;color:#1A1F36;letter-spacing:-.01em}
.sr{position:absolute;left:-9999px}
.shell{display:flex;flex-wrap:wrap;min-height:100vh}
.side{flex:1 1 220px;background:#F7F8FA;border-right:1px solid #E3E8EE;padding:16px 12px;display:flex;flex-direction:column;gap:2px}
@media(min-width:860px){.side{max-width:232px}}
.acct{display:flex;align-items:center;gap:10px;padding:6px 10px 18px}
.logo{width:28px;height:28px;border-radius:6px;background:#1A1F36;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none}
.acctname{font-weight:600;font-size:14px;line-height:1.3}
.acctsub{font-size:12px;color:#687385}
.navlabel{font-size:12px;color:#687385;padding:16px 10px 4px;font-weight:500}
.nav{display:flex;align-items:center;gap:10px;padding:0 10px;min-height:38px;border-radius:6px;color:#414552;font-size:14px;font-weight:500}
.nav:hover{background:#EBEEF1;color:#1A1F36}
.nav svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:#687385}
.nav.on,.nav.on svg{color:#3651C9}
.content{flex:999 1 560px;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 32px;border-bottom:1px solid #EBEEF1;flex-wrap:wrap}
.search{flex:1 1 240px;max-width:480px;display:flex;align-items:center;gap:8px;min-height:38px;padding:0 12px;border-radius:6px;background:#F7F8FA;color:#687385;font-size:14px}
.search svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.search input{border:none;background:transparent;font:inherit;color:#1A1F36;flex:1;min-width:0;outline:none}
.main{padding:28px 32px 72px;max-width:1280px;width:100%;display:flex;flex-direction:column;gap:32px}
@media(max-width:640px){.top,.main{padding-left:16px;padding-right:16px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:6px;border:1px solid #3651C9;background:#3651C9;color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:0 1px 1px rgba(26,31,54,.08)}
.btn:hover{background:#2C44B0;border-color:#2C44B0;color:#fff}
.btn.sec{background:#fff;color:#1A1F36;border-color:#D5DBE1}
.btn.sec:hover{background:#F7F8FA;color:#1A1F36}
.muted{color:#687385}
.badge{display:inline-flex;align-items:center;padding:0 6px;border-radius:4px;font-size:12px;font-weight:500;background:#EEF0F3;color:#4A5263;white-space:nowrap;line-height:20px}
.badge.ok{background:#E3F5E8;color:#1D6B35}
.badge.warn{background:#FDF0DA;color:#8A4B00}
.badge.info{background:#E8ECFB;color:#2F43B0}
.sh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding-bottom:12px;border-bottom:1px solid #EBEEF1;flex-wrap:wrap}
.sh h2{font-size:17px}
.th{font-size:12px;color:#687385;font-weight:500}
.tabs{display:flex;gap:22px;border-bottom:1px solid #EBEEF1;flex-wrap:wrap}
.tab{min-height:40px;padding:0;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;background:transparent;font:inherit;font-size:14px;font-weight:500;color:#687385;cursor:pointer}
.tab:hover{color:#1A1F36}
.tab.on{color:#3651C9;border-bottom-color:#3651C9}
.topic{width:100%;text-align:left;border:none;border-bottom:1px solid #EBEEF1;padding:12px 10px;background:#fff;font:inherit;font-size:14px;color:#1A1F36;cursor:pointer;display:flex;flex-direction:column;gap:4px;border-radius:0}
.topic:hover{background:#F7F8FA}
.topic.on{background:#F1F3FD}
.cal{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));border-top:1px solid #EBEEF1;border-left:1px solid #EBEEF1;min-width:860px}
.day{border-right:1px solid #EBEEF1;border-bottom:1px solid #EBEEF1;padding:10px;min-height:132px;display:flex;flex-direction:column;gap:6px;min-width:0}
.post{font-size:13px;line-height:1.45;padding:6px 8px;border-radius:4px;background:#F7F8FA;display:flex;flex-direction:column;gap:2px}
.dotl{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:#687385}
.dot{width:6px;height:6px;border-radius:99px;display:inline-block}
</style>
<style>[v-cloak]{display:none}</style>
</head>
<body>
<div id="app" v-cloak>
<div class="shell">
<nav class="side" aria-label="主导航">
<div class="acct"><div class="logo">王</div><div><div class="acctname">王老师咨询工作室</div><div class="acctsub">OPC 工作台 · 专业版</div></div></div>
<a class="nav" href="index.html"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7.5L8 3l5.5 4.5V13.5h-11z"></path></svg>首页</a>
<div class="navlabel">咨询</div>
<a class="nav" href="checkup.html"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2l5.5 4-2.1 6.5H4.6L2.5 6z"></path></svg>增长体检</a>
<a class="nav" href="diagnose.html"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5l3 3"></path></svg>需求诊断</a>
<a class="nav" href="proposal.html"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2h6l3 3v9H4z"></path><path d="M6.5 8h4M6.5 10.5h4"></path></svg>方案与报告</a>
<div class="navlabel">培训与交付</div>
<a class="nav" href="course.html"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h4a2 2 0 0 1 2 2V14a1.5 1.5 0 0 0-1.5-1.5H2zM14 3.5h-4a2 2 0 0 0-2 2V14a1.5 1.5 0 0 1 1.5-1.5H14z"></path></svg>课程生成</a>
<a class="nav" href="delivery.html"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5"></rect><path d="M5.5 8l1.8 1.8L10.5 6.5"></path></svg>项目交付</a>
<div class="navlabel">品牌</div>
<a class="nav on" href="brand.html"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5.5" r="2.5"></circle><path d="M3 13.5c.8-2.5 2.8-3.7 5-3.7s4.2 1.2 5 3.7"></path></svg>个人 IP</a>
</nav>

<div class="content">
<header class="top">
<label class="search"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5l3 3"></path></svg><span class="sr">搜索</span><input type="search" placeholder="搜索客户、项目、文档"></label>
<div style="margin-left: auto; display: flex; gap: 8px"><button class="btn sec" type="button">帮助</button></div>
</header>

<main class="main">
<div style="display: flex; flex-direction: column; gap: 10px">
<div class="muted" style="font-size: 13px"><a href="index.html">首页</a> / 个人 IP</div>
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div><h1 style="font-size: 26px">个人 IP</h1><div class="muted" style="font-size: 14px">做过的每个项目都是素材。AI 先脱敏、再提炼观点，变成持续获客的内容。</div></div>
<div style="display: flex; gap: 8px"><button class="btn sec" type="button">账号设置</button><button class="btn" type="button">新建内容</button></div>
</div>
<div class="tabs" role="tablist" aria-label="平台">
<template v-for="p in v.platforms"><button class="tab" :class="[p.cls]" type="button" role="tab" @click="p.pick">{{ p.label }}</button></template>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">
<section style="flex: 1 1 300px; min-width: 0">
<div class="sh"><h2>选题建议</h2><span class="muted" style="font-size: 13px">来自最近的项目，已脱敏</span></div>
<template v-for="t in v.topics">
<button class="topic" :class="[t.cls]" type="button" @click="t.pick"><span style="font-weight: 500">{{ t.title }}</span><span class="muted" style="font-size: 13px">{{ t.fmt }} · 素材：{{ t.src }}</span></button>
</template>
</section>

<section style="flex: 1.6 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<div class="sh"><h2>草稿预览</h2><div style="display: flex; gap: 8px"><button class="btn sec" type="button">换个角度</button><button class="btn" type="button">加入日历</button></div></div>
<div class="muted" style="font-size: 13px">{{ v.cur.fmt }} · 约 {{ v.cur.len }} 字</div>
<h2 style="font-size: 22px; line-height: 1.45">{{ v.cur.title }}</h2>
<template v-for="p in v.cur.paras"><p style="margin: 0; font-size: 16px; line-height: 1.9; color: #30374A">{{ p.text }}</p></template>
<div style="background: #FDF6EA; border-radius: 6px; padding: 10px 14px; font-size: 14px; color: #6B3A00">发布前请确认：文中没有客户名称、内部数据或未经同意的原话。</div>
</section>
</div>

<section>
<div class="sh"><h2>本周发布日历</h2>
<div style="display: flex; gap: 14px; flex-wrap: wrap"><span class="dotl"><span class="dot" style="background: #1D6B35"></span>公众号</span><span class="dotl"><span class="dot" style="background: #B5651D"></span>视频号</span><span class="dotl"><span class="dot" style="background: #A3262A"></span>小红书</span><span class="dotl"><span class="dot" style="background: #3651C9"></span>领英</span></div>
</div>
<div style="overflow-x: auto; padding-top: 16px">
<div class="cal">
<template v-for="d in v.days">
<div class="day"><div class="th">{{ d.label }}</div>
<template v-for="x in d.posts"><div class="post"><span class="dotl"><span class="dot" :style="{'background': x.color}"></span>{{ x.pf }}</span><span>{{ x.title }}</span></div></template>
</div>
</template>
</div>
</div>
</section>
</main>
</div>
</div>
</div>
<script src="assets/petite-vue.iife.js"></script>
<script>
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(p) { Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); }
}
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pf: '全部', topic: 0 };
  }
  renderVals() {
    const s = this.state;
    const platforms = ['全部', '公众号', '视频号', '小红书', '领英'].map((label) => ({
      label, cls: s.pf === label ? 'on' : '', pick: () => this.setState({ pf: label })
    }));
    const T = [
      { title: '制造业中层最缺的，不是 AI 工具', src: '精密制造项目周报', fmt: '公众号文章', len: 1800, paras: [
        '这半年我在一家制造企业做 AI 赋能项目，最大的感受是：工具从来不是瓶颈。',
        '试点部门 12 位主管里，真正卡住的是“不知道哪件事该交给 AI”。所以我们第一周没有教任何软件，只做了一件事：把每个人一周的工作拆成清单，逐条判断。',
        '结论很简单：先改工作方式，再选工具。下一篇我会分享这张拆解清单。'
      ] },
      { title: '店长每晚 11 点还在填报表？问题不在店长', src: '连锁零售诊断访谈', fmt: '视频号脚本', len: 400, paras: [
        '开场：一位店长跟我说，她每天晚上要填 3 张报表。',
        '中段：很多老板第一反应是“给店长培训”。但诊断下来，问题是总部没有统一标准，数据还在手工搬运。',
        '结尾：下次想做培训之前，先问一句，这是能力问题，还是机制问题？'
      ] },
      { title: '45 岁转型一人公司，我用了这 3 个数字员工', src: '个人经历', fmt: '小红书笔记', len: 600, paras: [
        '离开公司自己做咨询，最怕的不是没客户，是一个人忙不过来。',
        '现在我的“团队”是：诊断助手整理访谈，写作助手起草方案，交付助手盯进度和周报。',
        '我只做三件事：判断、沟通、拍板。'
      ] },
      { title: '给银行管理者上 AI 课的一点观察', src: '城商行内训大纲', fmt: '领英动态', len: 300, paras: [
        '下周要给一批城商行管理者上课。备课时我把练习占比提到了四成。',
        '原因是：管理者听“AI 很重要”已经太多次了，他们需要的是亲手做出一份周报。'
      ] }
    ];
    const pfOf = { '公众号文章': '公众号', '视频号脚本': '视频号', '小红书笔记': '小红书', '领英动态': '领英' };
    const visible = T.map((t, i) => ({ ...t, i })).filter((t) => s.pf === '全部' || pfOf[t.fmt] === s.pf);
    const sel = visible.find((t) => t.i === s.topic) || visible[0] || { ...T[0], i: 0 };
    const topics = visible.map((t) => ({ ...t, cls: t.i === sel.i ? 'on' : '', pick: () => this.setState({ topic: t.i }) }));
    const cur = { title: sel.title, fmt: sel.fmt, len: sel.len, paras: sel.paras.map((x) => ({ text: x })) };
    const color = { '公众号': '#1D6B35', '视频号': '#B5651D', '小红书': '#A3262A', '领英': '#3651C9' };
    const plan = [
      ['周一 10/6', [['公众号', '为什么我不再先教工具']]],
      ['周二 10/7', [['小红书', '一人公司的一天']]],
      ['周三 10/8', [['视频号', '店长报表问题 60 秒'], ['领英', '银行管理者 AI 课观察']]],
      ['周四 10/9', []],
      ['周五 10/10', [['公众号', '制造业中层最缺的，不是 AI 工具']]],
      ['周六 10/11', [['小红书', '我的 3 个数字员工']]],
      ['周日 10/12', [['视频号', '本周问答合集']]]
    ];
    const days = plan.map(([label, posts]) => ({
      label,
      posts: posts.filter(([pf]) => s.pf === '全部' || s.pf === pf).map(([pf, title]) => ({ pf, title, color: color[pf] }))
    }));
    return { platforms, topics, cur, days };
  }
}
const inst = PetiteVue.reactive(new Component({}));
PetiteVue.createApp({ get v() { return inst.renderVals(); } }).mount('#app');
</script>
</body>
</html>
