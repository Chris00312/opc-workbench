<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方案与报告 · OPC 智能工作台</title>
<style>
body{margin:0;background:#fff;color:#1A1F36;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei","Helvetica Neue",sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
a{color:#3651C9;text-decoration:none}a:hover{color:#1F2F8A}
h1,h2,h3{margin:0;font-weight:600;color:#1A1F36;letter-spacing:-.01em}
.sr{position:absolute;left:-9999px}
.shell{display:flex;flex-wrap:wrap;min-height:100vh}
.side{flex:1 1 220px;background:#F7F8FA;border-right:1px solid #E3E8EE;padding:16px 12px;display:flex;flex-direction:column;gap:2px}
@media(min-width:860px){.side{max-width:232px}}
.acct{display:flex;align-items:center;gap:10px;padding:6px 10px 18px}
.logo{width:28px;height:28px;border-radius:6px;background:#1A1F36;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none}
.acctname{font-weight:600;font-size:14px;line-height:1.3}
.acctsub{font-size:12px;color:#687385}
.navlabel{font-size:12px;color:#687385;padding:16px 10px 4px;font-weight:500}
.nav{display:flex;align-items:center;gap:10px;padding:0 10px;min-height:38px;border-radius:6px;color:#414552;font-size:14px;font-weight:500}
.nav:hover{background:#EBEEF1;color:#1A1F36}
.nav svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;color:#687385}
.nav.on,.nav.on svg{color:#3651C9}
.content{flex:999 1 560px;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:12px 32px;border-bottom:1px solid #EBEEF1;flex-wrap:wrap}
.search{flex:1 1 240px;max-width:480px;display:flex;align-items:center;gap:8px;min-height:38px;padding:0 12px;border-radius:6px;background:#F7F8FA;color:#687385;font-size:14px}
.search svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.search input{border:none;background:transparent;font:inherit;color:#1A1F36;flex:1;min-width:0;outline:none}
.main{padding:24px 32px 72px;max-width:1280px;width:100%;display:flex;flex-direction:column;gap:24px}
@media(max-width:640px){.top,.main{padding-left:16px;padding-right:16px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:6px;border:1px solid #3651C9;background:#3651C9;color:#fff;font:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;box-shadow:0 1px 1px rgba(26,31,54,.08)}
.btn:hover{background:#2C44B0;border-color:#2C44B0;color:#fff}
.btn.sec{background:#fff;color:#1A1F36;border-color:#D5DBE1}
.btn.sec:hover{background:#F7F8FA;color:#1A1F36}
.muted{color:#687385}
.badge{display:inline-flex;align-items:center;padding:0 6px;border-radius:4px;font-size:12px;font-weight:500;background:#EEF0F3;color:#4A5263;white-space:nowrap;line-height:20px}
.badge.ok{background:#E3F5E8;color:#1D6B35}
.badge.warn{background:#FDF0DA;color:#8A4B00}
.badge.info{background:#E8ECFB;color:#2F43B0}
.th{font-size:12px;color:#687385;font-weight:500}
.field{width:100%;min-height:38px;border:1px solid #D5DBE1;border-radius:6px;padding:8px 10px;background:#fff;font:inherit;font-size:14px;color:#1A1F36}
.field:focus{outline:none;border-color:#3651C9;box-shadow:0 0 0 3px rgba(54,81,201,.18)}
.tabs{display:flex;gap:24px;border-bottom:1px solid #EBEEF1}
.tab{min-height:40px;padding:0;border:none;border-bottom:2px solid transparent;margin-bottom:-1px;background:transparent;font:inherit;font-size:14px;font-weight:500;color:#687385;cursor:pointer}
.tab:hover{color:#1A1F36}
.tab.on{color:#3651C9;border-bottom-color:#3651C9}
.sec{display:flex;align-items:center;gap:10px;width:100%;min-height:36px;padding:6px 10px;border:none;border-radius:6px;background:transparent;font:inherit;font-size:14px;color:#414552;text-align:left;cursor:pointer}
.sec:hover{background:#F7F8FA}
.sec.on{background:#F1F3FD;color:#2F43B0;font-weight:500}
.doc p{margin:0;font-size:16px;line-height:1.9;color:#30374A}
.sug{padding:14px 0;border-bottom:1px solid #EBEEF1;display:flex;flex-direction:column;gap:6px;font-size:14px}
.link{border:none;background:none;padding:0;font:inherit;font-size:14px;font-weight:500;color:#3651C9;cursor:pointer;align-self:flex-start;min-height:28px}
.link:hover{color:#1F2F8A}
.qp{min-height:30px;padding:0 10px;border-radius:6px;border:1px solid #D5DBE1;background:#fff;font:inherit;font-size:13px;color:#414552;cursor:pointer}
.qp:hover{background:#F7F8FA}
</style>
<style>[v-cloak]{display:none}</style>
</head>
<body>
<div id="app" v-cloak>
<div class="shell">
<nav class="side" aria-label="主导航">
<div class="acct"><div class="logo">王</div><div><div class="acctname">王老师咨询工作室</div><div class="acctsub">OPC 工作台 · 专业版</div></div></div>
<a class="nav" href="index.html"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 7.5L8 3l5.5 4.5V13.5h-11z"></path></svg>首页</a>
<div class="navlabel">咨询</div>
<a class="nav" href="diagnose.html"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5l3 3"></path></svg>需求诊断</a>
<a class="nav on" href="proposal.html"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2h6l3 3v9H4z"></path><path d="M6.5 8h4M6.5 10.5h4"></path></svg>方案与报告</a>
<div class="navlabel">培训与交付</div>
<a class="nav" href="course.html"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h4a2 2 0 0 1 2 2V14a1.5 1.5 0 0 0-1.5-1.5H2zM14 3.5h-4a2 2 0 0 0-2 2V14a1.5 1.5 0 0 1 1.5-1.5H14z"></path></svg>课程生成</a>
<a class="nav" href="delivery.html"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="2.5" width="11" height="11" rx="1.5"></rect><path d="M5.5 8l1.8 1.8L10.5 6.5"></path></svg>项目交付</a>
<div class="navlabel">品牌</div>
<a class="nav" href="brand.html"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="5.5" r="2.5"></circle><path d="M3 13.5c.8-2.5 2.8-3.7 5-3.7s4.2 1.2 5 3.7"></path></svg>个人 IP</a>
</nav>

<div class="content">
<header class="top">
<label class="search"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5l3 3"></path></svg><span class="sr">搜索</span><input type="search" placeholder="搜索客户、项目、文档"></label>
<div style="margin-left: auto; display: flex; gap: 8px"><button class="btn sec" type="button">帮助</button></div>
</header>

<main class="main">
<div style="display: flex; flex-direction: column; gap: 10px">
<div class="muted" style="font-size: 13px"><a href="index.html">首页</a> / 某区域连锁零售 / 方案与报告</div>
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap">
<div><h1 style="font-size: 26px">{{ v.docTitle }}</h1><div class="muted" style="font-size: 14px">模板：咨询建议书标准版 · 已自动保存</div></div>
<div style="display: flex; gap: 8px; flex-wrap: wrap"><button class="btn sec" type="button">导出 Word</button><button class="btn sec" type="button">导出 PPT</button><button class="btn" type="button">发送给客户</button></div>
</div>
<div class="tabs" role="tablist" aria-label="文档类型">
<button class="tab" :class="[v.tabP]" type="button" role="tab" @click="v.showP">项目建议书</button>
<button class="tab" :class="[v.tabR]" type="button" role="tab" @click="v.showR">阶段报告</button>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
<aside style="flex: 1 1 200px; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div class="th" style="padding: 0 10px 8px">目录</div>
<template v-for="s in v.sections">
<button class="sec" :class="[s.cls]" type="button" @click="s.pick"><span class="muted" style="width: 16px">{{ s.n }}</span><span style="flex: 1">{{ s.title }}</span><span class="badge" :class="[s.tagCls]">{{ s.status }}</span></button>
</template>
</aside>

<article class="doc" style="flex: 999 1 440px; min-width: 0; max-width: 720px; display: flex; flex-direction: column; gap: 18px">
<div class="muted" style="font-size: 13px">第 {{ v.cur.n }} 部分 · AI 起草，你修改了 {{ v.cur.edits }} 处</div>
<h2 style="font-size: 24px">{{ v.cur.title }}</h2>
<template v-for="p in v.cur.paras"><p>{{ p.text }}</p></template>
<template v-if="v.showApplied">
<p style="background: #F7F8FA; border-radius: 6px; padding: 12px 14px; font-size: 15px">同类连锁企业推行运营标准化时，通常先选 [数量] 家试点门店跑通 4–6 周，再全面推广。（行业参考，请替换为你掌握的真实案例）</p>
</template>
</article>

<aside style="flex: 1 1 280px; min-width: 0; border-left: 1px solid #EBEEF1; padding-left: 24px; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 4px"><h3 style="font-size: 15px">AI 建议</h3><span class="muted" style="font-size: 12px">基于诊断结论和访谈记录</span></div>
<template v-for="g in v.sugs">
<div class="sug"><div style="font-weight: 500">{{ g.title }}</div><div class="muted">{{ g.desc }}</div><button class="link" type="button" @click="g.apply">{{ g.label }}</button></div>
</template>
<div style="display: flex; flex-wrap: wrap; gap: 6px; padding: 14px 0 10px">
<button class="qp" type="button">语气更正式</button>
<button class="qp" type="button">压缩到一页</button>
<button class="qp" type="button">换成老板视角</button>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 500">让 AI 修改<textarea class="field" rows="3" placeholder="例如：报价拆成基础版和完整版两档"></textarea></label>
<div style="padding-top: 8px"><button class="btn sec" type="button">发送</button></div>
</aside>
</div>
</main>
</div>
</div>
</div>
<script src="assets/petite-vue.iife.js"></script>
<script>
class DCLogic {
  constructor(props) { this.props = props || {}; this.state = {}; }
  setState(p) { Object.assign(this.state, typeof p === 'function' ? p(this.state) : p); }
}
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { doc: 'p', sec: 0, applied: {} };
  }
  renderVals() {
    const s = this.state;
    const P = [
      { title: '项目背景与诊断结论', status: '已确认', edits: 3, paras: [
        '贵司计划今年为门店店长开展系统培训，以提升门店业绩。在前期与运营总监、两位店长和督导的访谈中，我们发现培训需求背后有更根本的问题。',
        '目前门店的开店、交接班等关键流程主要靠老员工口头传授，店长每天需要手工填写多张报表，总部通知依赖微信群传达。这导致各门店执行标准不一，总部难以看到过程、及时纠偏。',
        '因此，我们建议把项目重心从“培训店长”调整为“先建立统一的运营标准，再通过培训和工具确保落地”。'
      ] },
      { title: '项目目标', status: '已确认', edits: 1, paras: [
        '目标一：梳理并发布门店核心运营 SOP，覆盖开店、交接班、闭店等关键场景。',
        '目标二：减少店长日常手工报表时间，具体降幅在试点后与贵司共同确定。',
        '目标三：建立总部到门店的通知触达与确认机制，做到“发了就能查到谁看了”。'
      ] },
      { title: '实施方案', status: '待确认', edits: 0, paras: [
        '第一阶段（诊断深化）：走访 [数量] 家代表门店，记录实际作业流程，识别差异点。',
        '第二阶段（标准共创）：与优秀店长共同编写 SOP，配套图文版和短视频版操作卡。',
        '第三阶段（试点落地）：选取试点门店上线 AI 巡店助手，店长按 SOP 打卡，督导线上点评。'
      ] },
      { title: '排期与里程碑', status: '草稿', edits: 0, paras: [
        '整体周期建议为 [周数] 周，分三个阶段推进，每阶段结束提交阶段报告并召开评审会。',
        '关键里程碑：诊断报告确认、SOP 1.0 发布、试点复盘会。具体日期请与客户确认后填写。'
      ] },
      { title: '报价', status: '草稿', edits: 0, paras: [
        '基础版：诊断 + SOP 共创，报价 ¥[金额]。',
        '完整版：基础版 + 试点落地陪跑 + 店长训练营，报价 ¥[金额]。'
      ] },
      { title: '服务团队与保障', status: '草稿', edits: 0, paras: [
        '项目由王老师主导交付，平台认证的数字化顾问协同支持工具部署。',
        '每周五提交项目周报，重要节点提前三个工作日确认议程。'
      ] }
    ];
    const R = [
      { title: '本阶段完成情况', status: '已确认', edits: 2, paras: [
        '第一阶段已完成 6 位关键人员访谈和 [数量] 家门店现场观察，形成门店作业流程现状图。',
        '与原计划相比，门店走访数量按计划完成，访谈多补充了 1 位区域督导。'
      ] },
      { title: '关键发现', status: '待确认', edits: 0, paras: [
        '各门店开店流程存在多处做法差异，其中收银备用金核对和陈列检查最不统一。',
        '店长认为最耗时的工作是晚间报表，其中多项数据可以从收银系统直接导出。'
      ] },
      { title: '下阶段计划', status: '草稿', edits: 0, paras: [
        '下阶段将组织两场 SOP 共创工作坊，邀请 [数量] 位优秀店长参与。'
      ] },
      { title: '需客户配合事项', status: '草稿', edits: 0, paras: [
        '请提供收银系统的报表导出样例，并指定一位总部对接人负责 SOP 审核。'
      ] }
    ];
    const list = s.doc === 'p' ? P : R;
    const idx = Math.min(s.sec, list.length - 1);
    const tagOf = (st) => (st === '已确认' ? 'ok' : st === '待确认' ? 'warn' : '');
    const sections = list.map((x, i) => ({
      n: i + 1, title: x.title, status: x.status, tagCls: tagOf(x.status),
      cls: i === idx ? 'on' : '', pick: () => this.setState({ sec: i })
    }));
    const c = list[idx];
    const cur = { n: idx + 1, title: c.title, edits: c.edits, paras: c.paras.map((t) => ({ text: t })) };
    const raw = [
      { id: 'case', title: '补充行业参考', desc: '在本节末尾加入同类连锁企业推行标准化的做法，增强说服力。' },
      { id: 'quote', title: '引用客户原话', desc: '把店长 A 关于报表的原话放进背景，让决策者更有共鸣。' },
      { id: 'risk', title: '增加风险与应对', desc: '店长抵触新流程是常见风险，建议写明应对办法。' }
    ];
    const key = s.doc + idx;
    const sugs = raw.map((g) => {
      const on = !!s.applied[key + g.id];
      return { ...g, label: on ? '已应用，撤销' : '应用到文档',
        apply: () => this.setState({ applied: { ...this.state.applied, [key + g.id]: !on } }) };
    });
    return {
      sections, cur, sugs,
      showApplied: !!s.applied[key + 'case'],
      docTitle: s.doc === 'p' ? '门店运营标准化项目建议书' : '第一阶段诊断报告',
      tabP: s.doc === 'p' ? 'on' : '', tabR: s.doc === 'r' ? 'on' : '',
      showP: () => this.setState({ doc: 'p', sec: 0 }),
      showR: () => this.setState({ doc: 'r', sec: 0 })
    };
  }
}
const inst = PetiteVue.reactive(new Component({}));
PetiteVue.createApp({ get v() { return inst.renderVals(); } }).mount('#app');
</script>
</body>
</html>
